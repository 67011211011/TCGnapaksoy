app = "CHANGE-ME-clubboard"
primary_region = "sin"

[build]

[env]
  PORT = "8080"
  DB_PATH = "/data/app.db"
  COOKIE_SECURE = "true"
  TRUST_PROXY = "true"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
